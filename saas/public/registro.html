<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index">
  <title>Crear cuenta · ImpulsaIA</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/js/auth.js"></script>
</head>
<body data-page="registro">
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/"><span class="logo-mark" aria-hidden="true">IA</span><span data-app-name>ImpulsaIA</span></a>
    </div>
  </header>
  <main class="auth-wrap">
    <div class="card auth-card">
      <h1>Crea tu cuenta gratis</h1>
      <p class="muted">Sin tarjeta. Créditos gratuitos cada mes.</p>
      <form id="form" novalidate>
        <div class="alert alert-error hidden" data-form-error role="alert"></div>
        <div class="field">
          <label for="name">Tu nombre</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>
          <div class="field-error" data-error-for="name"></div>
        </div>
        <div class="field">
          <label for="businessName">Nombre de tu negocio <span class="muted">(opcional)</span></label>
          <input id="businessName" name="businessName" type="text" autocomplete="organization" maxlength="150">
          <div class="field-error" data-error-for="businessName"></div>
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
          <div class="field-error" data-error-for="email"></div>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
          <span class="help">Mínimo 10 caracteres. Una frase de varias palabras es más segura y fácil de recordar.</span>
          <div class="field-error" data-error-for="password"></div>
        </div>
        <div class="field">
          <label class="check"><input type="checkbox" name="acceptTerms" required> <span>Acepto los <a href="/terminos" target="_blank" rel="noopener">términos</a> y el <a href="/privacidad" target="_blank" rel="noopener">aviso de privacidad</a>.</span></label>
          <div class="field-error" data-error-for="acceptTerms"></div>
        </div>
        <button class="btn btn-block" type="submit">Crear cuenta</button>
      </form>
      <p class="switch">¿Ya tienes cuenta? <a href="/entrar">Inicia sesión</a></p>
    </div>
  </main>
</body>
</html>
