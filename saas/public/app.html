<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mi panel · ImpulsaIA</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/js/app.js"></script>
</head>
<body data-page="app">
  <div class="shell">
    <aside class="sidebar">
      <a class="logo" href="/app#/"><span class="logo-mark" aria-hidden="true">IA</span><span data-app-name>ImpulsaIA</span></a>
      <nav class="nav" id="nav" aria-label="Secciones"></nav>
      <div class="bottom" id="sidebar-bottom"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="who" id="who"></div>
        <div class="btn-row" id="top-actions"></div>
      </header>
      <main class="content" id="view" tabindex="-1">
        <div class="loading"><span class="spinner dark"></span> Cargando…</div>
      </main>
    </div>
  </div>
</body>
</html>
