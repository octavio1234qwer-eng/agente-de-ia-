<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index">
  <title data-i18n="signin.title">Iniciar sesión · ImpulsaIA</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/js/auth.js"></script>
</head>
<body data-page="entrar">
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/"><span class="logo-mark" aria-hidden="true">IA</span><span data-app-name>ImpulsaIA</span></a>
      <span id="lang-slot"></span>
    </div>
  </header>
  <main class="auth-wrap">
    <div class="card auth-card">
      <h1 data-i18n="signin.heading">Inicia sesión</h1>
      <p class="muted" data-i18n="signin.lead">Qué gusto verte de nuevo.</p>
      <form id="form" novalidate>
        <div class="alert alert-error hidden" data-form-error role="alert"></div>
        <div class="field">
          <label for="email" data-i18n="field.email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
          <div class="field-error" data-error-for="email"></div>
        </div>
        <div class="field">
          <label for="password" data-i18n="field.password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <div class="field-error" data-error-for="password"></div>
        </div>
        <button class="btn btn-block" type="submit" data-i18n="signin.submit">Entrar</button>
      </form>
      <p class="switch"><a href="/recuperar" data-i18n="signin.forgot">¿Olvidaste tu contraseña?</a></p>
      <p class="switch"><span data-i18n="signin.no_account">¿No tienes cuenta?</span> <a href="/registro" data-i18n="signin.create">Crea una gratis</a></p>
    </div>
  </main>
</body>
</html>
