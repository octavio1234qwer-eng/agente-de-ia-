<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index">
  <title>Iniciar sesión · ImpulsaIA</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/js/auth.js"></script>
</head>
<body data-page="entrar">
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/"><span class="logo-mark" aria-hidden="true">IA</span><span data-app-name>ImpulsaIA</span></a>
    </div>
  </header>
  <main class="auth-wrap">
    <div class="card auth-card">
      <h1>Inicia sesión</h1>
      <p class="muted">Qué gusto verte de nuevo.</p>
      <form id="form" novalidate>
        <div class="alert alert-error hidden" data-form-error role="alert"></div>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <div class="field-error" data-error-for="email"></div>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <div class="field-error" data-error-for="password"></div>
        </div>
        <button class="btn btn-block" type="submit">Entrar</button>
      </form>
      <p class="switch"><a href="/recuperar">¿Olvidaste tu contraseña?</a></p>
      <p class="switch">¿No tienes cuenta? <a href="/registro">Crea una gratis</a></p>
    </div>
  </main>
</body>
</html>
