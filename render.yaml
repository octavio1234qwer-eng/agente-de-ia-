# Blueprint de Render para la plataforma SaaS que vive en la carpeta saas/.
# No afecta al agente de WhatsApp de la raíz: ese servicio se administra aparte.
# Guía completa: saas/docs/DESPLIEGUE.md
#
# Al crear el Blueprint, Render pedirá los valores marcados con `sync: false`.
# Los servicios no indican `plan`: Render usa su instancia de pago más pequeña, que no se duerme.
# Puedes cambiar el plan después en el panel. Usa la misma región para la app y la base.
services:
  - type: web
    name: impulsaia
    runtime: node
    rootDir: saas
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: APP_TIMEZONE
        value: America/Mexico_City
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: impulsaia-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: APP_NAME
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: impulsaia-db
    region: ohio
    databaseName: impulsaia
    user: impulsaia
