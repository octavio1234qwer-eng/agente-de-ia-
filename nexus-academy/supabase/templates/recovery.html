<div style="background:#05060b;padding:32px 12px;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#e5e7f0">
  <div style="max-width:560px;margin:0 auto;background:#0b0e1a;border:1px solid #1d2340;border-radius:20px;padding:32px 28px">
    <p style="margin:0 0 20px;color:#fff;font-weight:700;letter-spacing:4px;font-size:14px">NEXUS ACADEMY</p>
    <h1 style="margin:0 0 12px;font-size:24px;color:#fff">Restablecer contraseña</h1>
    <p style="font-size:15px;line-height:24px;color:#c3c8dc">Recibimos una solicitud para restablecer la contraseña de tu cuenta. El enlace es válido durante 1 hora y solo se puede usar una vez.</p>
    <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/restablecer" style="display:inline-block;padding:13px 22px;border-radius:12px;background:#3b74ff;color:#fff;font-weight:600;text-decoration:none">Crear nueva contraseña</a></p>
    <p style="font-size:13px;color:#8b93b8">Si no solicitaste este cambio, ignora este correo.</p>
  </div>
</div>
